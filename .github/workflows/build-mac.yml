name: Build macOS app

# 在 GitHub 的 macOS (Apple 芯片) runner 上把应用打成 .dmg，并挂到指定 Release。
#
# ⚠️ 2026-07-28 起不再随发版自动构建（用户决定不再发 Mac 版）。原来的
# `release: types: [published]` 触发已移除，只保留手动触发。以后要给某个
# Release 补 .dmg，去 Actions 页手动跑本工作流并填 release_tag 即可；要恢复
# 自动发布就把那两行 trigger 加回来。
#
# 停发 Mac：客户端已移除运行时自动更新,仅保留手动触发构建
# 不到 .dmg 时 pkg_url 为 None，检查更新会判定「无可用更新」而不是报错。
# 不做 Apple 签名/公证：用户首次需右键→打开（README 有说明）。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要挂载 .dmg 的 Release tag（例如 v1.0.15）"
        required: true
        default: "v1.0.15"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14 # Apple 芯片 (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 构建 .app
        run: python -m PyInstaller MarketMaker-mac.spec --noconfirm

      - name: 打包 .dmg + 算 SHA-256
        run: |
          set -euo pipefail
          APP="dist/PolymarketMarketMaker.app"
          test -d "$APP" || { echo "未找到 $APP"; ls -la dist; exit 1; }
          STAGING=dmg_staging
          rm -rf "$STAGING"; mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          DMG="PolymarketMarketMaker_Mac_arm64.dmg"
          hdiutil create -volname "Polymarket MarketMaker" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          shasum -a 256 "$DMG" | awk '{print $1}' > "$DMG.sha256"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: 解析目标 Release tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.release.tag_name }}"; fi
          test -n "$TAG" || { echo "未能确定 Release tag"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "上传 $DMG -> Release $TAG"
          gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
