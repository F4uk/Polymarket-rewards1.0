{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>仪表盘</h1>
    <div class="controls">
        <button class="btn btn-success" onclick="engineAction('start-all')">全部启动</button>
        <button class="btn btn-danger" onclick="engineAction('stop-all', '止损监控将停止，确定要停止所有引擎吗？')">全部停止</button>
        <button class="btn btn-warning" onclick="engineAction('restart', '将重启所有引擎以加载新参数，确定吗？')">重启引擎</button>
    </div>
</div>

<div id="tier-warning" class="flash" style="display:none"></div>

<div class="config-section">
    <h2>手动调试</h2>
    <div class="controls">
        <button class="btn btn-sm btn-primary" onclick="engineAction('start-monitors')">启动监控</button>
        <button class="btn btn-sm btn-primary" onclick="scanMarkets()">扫描市场</button>
        <button class="btn btn-sm btn-success" onclick="placeOrders()">分发挂单</button>
        <button class="btn btn-sm btn-warning" onclick="testPlaceOrders()">测试挂单</button>
        <button class="btn btn-sm btn-danger" onclick="cancelAllOrders()">全部撤单</button>
    </div>
</div>

<div class="stat-cards">
    <div class="stat-card"><h3>引擎状态</h3><div class="v" id="engine-status">-</div></div>
    <div class="stat-card"><h3>总挂单</h3><div class="v" id="total-orders">-</div></div>
    <div class="stat-card"><h3>总持仓</h3><div class="v" id="total-positions">-</div></div>
    <div class="stat-card"><h3>总盈亏</h3><div class="v" id="total-pnl">-</div></div>
    <div class="stat-card"><h3>合格市场</h3><div class="v" id="eligible-count">-</div></div>
    <div class="stat-card"><h3>退出处理中</h3><div class="v" id="exits-pending">-</div></div>
</div>

<h2>钱包状态</h2>
<table class="data-table" id="wallet-table">
    <thead>
        <tr>
            <th>钱包地址</th>
            <th>余额 (pUSD)</th>
            <th>挂单数</th>
            <th>持仓数</th>
            <th>上次活跃</th>
            <th>状态</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody id="wallet-body"></tbody>
</table>
<p class="metric-note">合格市场的明细与梯队预演在「市场发现」页查看。</p>
{% endblock %}

{% block scripts %}
<script>
function refreshDashboard() {
    fetch('/api/dashboard').then(r => r.json()).then(data => {
        const tw = data.templates_without_tiers || [];
        const warn = document.getElementById('tier-warning');
        if (tw.length) {
            warn.style.display = '';
            warn.textContent = '⚠️ 模板「' + tw.join('」「') + '」未配置档位模块，绑定这些模板的钱包不会挂单（去 配置 → 档位模块 添加）';
        } else {
            warn.style.display = 'none';
        }
        document.getElementById('total-orders').textContent = data.total_orders;
        document.getElementById('total-positions').textContent = data.total_positions;
        document.getElementById('total-pnl').textContent = (data.total_pnl || 0).toFixed(2) + ' pUSD';
        document.getElementById('exits-pending').textContent = data.exits_pending ?? 0;
        const engineRunning = (data.wallets || []).some(w => w.running);
        document.getElementById('engine-status').innerHTML =
            `<span class="status ${engineRunning ? 'running' : 'stopped'}">${engineRunning ? '运行中' : '已停止'}</span>`;
        const tbody = document.getElementById('wallet-body');
        tbody.innerHTML = (data.wallets || []).map(w => `
            <tr>
                <td title="${escapeHtml(w.address)}">${escapeHtml(walletLabel(w.remark, w.address))}</td>
                <td>${w.balance != null ? w.balance.toFixed(2) : '-'}</td>
                <td>${w.open_orders ?? '-'}</td>
                <td>${w.positions ?? '-'}</td>
                <td title="${escapeHtml(absTime(w.last_active_at))}">${escapeHtml(relTime(w.last_active_at))}</td>
                <td><span class="status ${w.running ? 'running' : 'stopped'}">${w.running ? '运行中' : '已停止'}</span></td>
                <td>
                    ${w.running
                        ? `<button class="btn btn-sm btn-danger" onclick="walletAction('${w.address}', 'stop')">停止</button>`
                        : `<button class="btn btn-sm btn-success" onclick="walletAction('${w.address}', 'start')">启动</button>`
                    }
                </td>
            </tr>
        `).join('');
    });
}

function refreshEligibleCount() {
    fetch('/api/eligible').then(r => r.json()).then(d => {
        document.getElementById('eligible-count').textContent = (d.markets || []).length;
    }).catch(() => {});
}

function engineAction(action, confirmMsg) {
    if (confirmMsg && !confirm(confirmMsg)) return;
    fetch(`/api/engine/${action}`, {method: 'POST'}).then(r => r.json()).then(data => {
        if (data.message) alert(data.message);
        refreshDashboard();
    });
}

function scanMarkets() {
    // 触发扫描后跳到「市场发现」页看进度与结果
    fetch('/api/engine/scan', {method: 'POST'});
    window.location.href = '/markets';
}

function placeOrders() {
    if (!confirm('确定将 eligible 列表分发到所有钱包挂单？')) return;
    fetch('/api/engine/place-orders', {method: 'POST'}).then(r => r.json()).then(() => refreshDashboard());
}

function testPlaceOrders() {
    if (!confirm('将用第一个启用钱包的真实资金，最多挂出 3 个测试买单，确认？')) return;
    fetch('/api/engine/test-place-orders', {method: 'POST'}).then(r => r.json()).then(data => {
        if (data.message) alert(data.message);
        refreshDashboard();
    });
}

function cancelAllOrders() {
    if (!confirm('确定撤销所有钱包的全部买单？')) return;
    fetch('/api/engine/cancel-all', {method: 'POST'}).then(r => r.json()).then(() => refreshDashboard());
}

function walletAction(address, action) {
    if (action === 'stop' && !confirm('止损监控将停止，确定要停止该钱包引擎吗？')) return;
    fetch(`/api/engine/${address}/${action}`, {method: 'POST'}).then(r => r.json()).then(data => {
        if (data.message) alert(data.message);
        refreshDashboard();
    });
}

refreshDashboard();
refreshEligibleCount();
setInterval(refreshDashboard, 5000);
setInterval(refreshEligibleCount, 30000);
</script>
{% endblock %}
