<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>初始设置 - Polymarket 做市助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-container">
        <h1>初始设置</h1>
        <p>请设置访问密码（用于加密保护您的钱包私钥）</p>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-messages">
            {% for msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label>设置密码</label>
                <input type="password" name="password" required minlength="12">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" name="confirm" required minlength="12">
            </div>
            <button type="submit" class="btn btn-primary">确认设置</button>
        </form>
        <p class="auth-version">当前版本 v{{ app_version }}</p>
    </div>
</body>
</html>
